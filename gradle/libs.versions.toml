[versions]
agp = "8.7.3"
bcprovJdk18on = "1.80"
firebaseMessaging = "24.1.1"
kotlin = "1.9.24"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
google = "4.4.2"
okhttp = "4.12.0"
paperparcel = "2.0.4"
paperparcelCompiler = "2.0.4"
paperparcelKotlin = "2.0.4"
sshj = "0.39.0"
timber = "5.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprovJdk18on" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging"}
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
paperparcel = { module = "nz.bradcampbell:paperparcel", version.ref = "paperparcel" }
paperparcel-compiler = { module = "nz.bradcampbell:paperparcel-compiler", version.ref = "paperparcelCompiler" }
paperparcel-kotlin = { module = "nz.bradcampbell:paperparcel-kotlin", version.ref = "paperparcelKotlin" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google" }
